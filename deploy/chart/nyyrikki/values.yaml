# Values for the Nyyrikki chart (docs/06). The chart creates no Secret:
# create the ones named under `secrets` yourself (docs/06 D2).

image:
  repository: ghcr.io/tuhis/nyyrikki
  # Defaults to the chart's appVersion. Prefer pinning `digest`.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  # Secrets for a private registry, e.g. [{name: ghcr-pull}].
  pullSecrets: []

# Nyyrikki's canonical https URL, as agents reach it (docs/01 D9, D10).
canonicalURL: ""

auth:
  issuer: ""                       # e.g. https://keycloak.example.com/realms/nyyrikki
  cliClientID: nyyrikki-cli
  scope: nyyrikki                  # the optional scope whose Audience mapper sets aud
  # Keycloak 26.8 introspects a token only for a client in its audience, so
  # the introspection client is named after Nyyrikki's audience; empty means
  # canonicalURL + "/mcp" (docs/setup/keycloak.md).
  introspectionClientID: ""

approval:
  timeout: 3m

run:
  defaultTimeout: 60s
  maxTimeout: 10m
  maxInteractive: 30m
  maxOutput: 1MiB

# The one human of this version (docs/02 D4). They are also the approver.
human:
  id: owner
  subject: ""                      # the token `sub` of the human in the authorization server
  kubernetes:
    user: ""                       # the Kubernetes user requests run as (impersonated)
    groups: []
  telegramUserID: 0                # required: see docs/setup/telegram.md for how to learn it

# Targets (docs/02 D5, docs/04 D9). A remote target names a Secret in this
# namespace with keys `ca.crt` and `token` (deploy/remote-target/).
targets:
  - name: this-cluster
    description: The cluster Nyyrikki runs in
    inCluster: true
    clients: []
  # - name: lab
  #   description: Lab cluster
  #   server: https://lab.example.com:6443
  #   secretName: nyyrikki-target-lab
  #   clients: []
  # An SSH host (docs/07, docs/setup/ssh-hosts.md). Start with empty
  # hostKeys, run the setup script on the host, then copy what it prints.
  # - name: db-1
  #   description: Primary database host
  #   ssh:
  #     address: db-1.example.com   # port 22 unless given, as host:port
  #     hostKeys: []
  #     hostCAs: []          # in addition to ssh.hostCAs
  #     sudo: false          # passwordless sudo; unset takes ssh.defaults.sudo
  #     sessionKill: false   # as the setup script reported
  #   clients: []

# Named sets of targets, of any type, for elevate (docs/08 D11): an
# elevation asked for a group covers the members it has at that moment.
# Group names share one namespace with target names.
groups: []
#  - name: web
#    targets: [web-1, web-2]

# Shared by every SSH target (docs/07 §5.5); required as soon as one exists.
ssh:
  # What hosts trust; must include the public key of secrets.sshUserCA.
  userCAPublicKeys: []
  # Nyyrikki's egress addresses as CIDRs, ideally its own (docs/07 §6).
  sourceAddresses: []
  connectTimeout: 10s
  # Host CA public keys trusted for every SSH target, besides each
  # target's own hostCAs (docs/08 D9).
  hostCAs: []
  # Host keys and host CA keys never trusted: a host presenting one, or a
  # certificate of or signed by one, is refused (docs/08 D9).
  revokedHostKeys: []
  defaults:
    sudo: false            # for SSH targets that don't set sudo (docs/08 D11)

telegram:
  apiURL: https://api.telegram.org

# Extra CA certificates to trust (a private CA for the authorization
# server, for example), as a ConfigMap in this namespace. They are added to
# the system roots, not instead of them.
trustedCA:
  configMap: ""
  key: ca.crt

secrets:
  tls: nyyrikki-tls                # type kubernetes.io/tls
  telegram:
    name: nyyrikki-telegram
    key: bot-token
  introspection:
    name: nyyrikki-keycloak
    key: client-secret
  # The SSH user CA's private key (docs/07 D6), mounted only with an SSH
  # target. Create it as docs/setup/ssh-hosts.md says.
  sshUserCA:
    name: nyyrikki-ssh-user-ca
    key: user-ca

# Impersonate the human's user and groups, nothing else (docs/06 D3).
rbac:
  create: true

networkPolicy:
  enabled: true
  # Namespaces allowed to reach :8443; empty means every namespace.
  ingressNamespaces: []
  egress:
    # When true, egress is limited to DNS and the CIDRs below (the
    # authorization server, Telegram, the API servers).
    restrict: false
    cidrs: []

persistence:
  size: 1Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 8443

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
