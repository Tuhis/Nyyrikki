{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nyyrikki.name" . }}
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nyyrikki.selector" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.egress.restrict }}, Egress{{ end }}]
  ingress:
    - ports: [{port: 8443, protocol: TCP}]
      {{- with .Values.networkPolicy.ingressNamespaces }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
    # The health port serves no data (docs/01 D10).
    - ports: [{port: 8081, protocol: TCP}]
  {{- if .Values.networkPolicy.egress.restrict }}
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.networkPolicy.egress.cidrs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
    {{- end }}
  {{- end }}
{{- end }}
