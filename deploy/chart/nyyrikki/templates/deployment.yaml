apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nyyrikki.name" . }}
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
spec:
  # One replica, never two pods on one database (docs/01 D11).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "nyyrikki.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nyyrikki.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "nyyrikki.name" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ eq (include "nyyrikki.inCluster" .) "true" }}
      enableServiceLinks: false
      securityContext: {{- include "nyyrikki.podSecurityContext" . | nindent 8 }}
      containers:
        - name: nyyrikkid
          image: {{ include "nyyrikki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/nyyrikki/config/config.yaml"]
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          securityContext: {{- include "nyyrikki.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.trustedCA.configMap }}
          # Extra roots, added to the system ones (Go reads every file in
          # SSL_CERT_DIR). Not a secret.
          env:
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/nyyrikki/trusted-ca
          {{- end }}
          # Credentials are files from Secrets, never env vars (docs/01 D15).
          volumeMounts:
            - {name: config, mountPath: /etc/nyyrikki/config, readOnly: true}
            - {name: tls, mountPath: /etc/nyyrikki/tls, readOnly: true}
            - {name: telegram, mountPath: /etc/nyyrikki/telegram, readOnly: true}
            - {name: keycloak, mountPath: /etc/nyyrikki/keycloak, readOnly: true}
            - {name: state, mountPath: /var/lib/nyyrikki}
            - {name: runtime, mountPath: /run/nyyrikki}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.trustedCA.configMap }}
            - {name: trusted-ca, mountPath: /etc/nyyrikki/trusted-ca, readOnly: true}
            {{- end }}
            {{- range .Values.targets }}{{ if not (or .inCluster .ssh .sops) }}
            - {name: target-{{ .name }}, mountPath: /etc/nyyrikki/targets/{{ .name }}, readOnly: true}
            {{- end }}{{ end }}
            {{- range .Values.targets }}{{ if .sops }}
            # A SOPS target's Google credential (docs/10 D6), read on
            # each use, so a replaced Secret applies without a rollout.
            - {name: gcp-{{ .name }}, mountPath: /etc/nyyrikki/gcp/{{ .name }}, readOnly: true}
            {{- end }}{{ end }}
            {{- if and (eq (include "nyyrikki.hasSOPS" .) "true") .Values.gcp.workloadIdentityAudience }}
            # The token Workload Identity Federation exchanges (docs/10
            # D6): for Google's audience only, so it opens nothing here.
            - {name: gcp-token, mountPath: /var/run/secrets/nyyrikki/gcp, readOnly: true}
            {{- end }}
            {{- if eq (include "nyyrikki.hasSSH" .) "true" }}
            # The SSH CA keys (docs/08 D1), read on each use, so a rotated
            # Secret applies without a rollout.
            - {name: ssh-ca, mountPath: /etc/nyyrikki/ssh, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "nyyrikki.name" . }}}
        - name: tls
          secret: {secretName: {{ .Values.secrets.tls }}, defaultMode: 0400}
        - name: telegram
          secret:
            secretName: {{ .Values.secrets.telegram.name }}
            defaultMode: 0400
            items: [{key: {{ .Values.secrets.telegram.key }}, path: bot-token}]
        - name: keycloak
          secret:
            secretName: {{ .Values.secrets.introspection.name }}
            defaultMode: 0400
            items: [{key: {{ .Values.secrets.introspection.key }}, path: client-secret}]
        - name: state
          persistentVolumeClaim: {claimName: {{ include "nyyrikki.name" . }}}
        # Per-run kubeconfigs live in memory only (docs/04 D9).
        - name: runtime
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        {{- if .Values.trustedCA.configMap }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCA.configMap }}
            items: [{key: {{ .Values.trustedCA.key }}, path: ca.crt}]
        {{- end }}
        {{- if eq (include "nyyrikki.hasSSH" .) "true" }}
        - name: ssh-ca
          secret:
            {{- if eq (include "nyyrikki.sshCompat" .) "true" }}
            # Deprecated R10 Secret, mounted instead of sshCA (docs/08 D14).
            secretName: {{ .Values.secrets.sshUserCA.name }}
            defaultMode: 0400
            items: [{key: {{ required "secrets.sshUserCA.key is required" .Values.secrets.sshUserCA.key }}, path: user-ca}]
            {{- else }}
            # Whole, with no items, so user-ca-next and host-ca appear when
            # the Secret has them (docs/08 D1, D14).
            secretName: {{ required "secrets.sshCA.name is required" .Values.secrets.sshCA.name }}
            defaultMode: 0400
            {{- end }}
        {{- end }}
        {{- range .Values.targets }}{{ if .sops }}
        - name: gcp-{{ .name }}
          secret:
            secretName: {{ required (printf "targets[%s].sops.gcpKMS.secretName is required" .name) (dig "gcpKMS" "secretName" "" .sops) }}
            defaultMode: 0400
            items: [{key: credentials.json, path: credentials.json}]
        {{- end }}{{ end }}
        {{- if and (eq (include "nyyrikki.hasSOPS" .) "true") .Values.gcp.workloadIdentityAudience }}
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.gcp.workloadIdentityAudience | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- range .Values.targets }}{{ if not (or .inCluster .ssh .sops) }}
        - name: target-{{ .name }}
          secret:
            secretName: {{ required (printf "targets[%s].secretName is required" .name) .secretName }}
            defaultMode: 0400
            items: [{key: ca.crt, path: ca.crt}, {key: token, path: token}]
        {{- end }}{{ end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
