{{- /* The config file of docs/02 §5.6. Paths are fixed by the chart's mounts; no secret is in it (docs/01 D12). */ -}}
{{- if le (int64 (.Values.human.telegramUserID | default 0)) 0 -}}
{{- fail "human.telegramUserID must be the approver's Telegram user ID (docs/setup/telegram.md)" -}}
{{- end -}}
{{- $targets := list -}}
{{- range .Values.targets -}}
{{- if .ssh -}}
{{- /* An SSH target (docs/07 §5.5): its host keys come from the setup script's output. */ -}}
{{- /* The address may omit the port (22), and sudo left unset takes ssh.defaults.sudo (docs/08 D11). */ -}}
{{- $s := dict "address" (required (printf "targets[%s].ssh.address is required" .name) .ssh.address)
  "host_keys" (.ssh.hostKeys | default list) "host_cas" (.ssh.hostCAs | default list)
  "session_kill" (.ssh.sessionKill | default false) -}}
{{- if and (hasKey .ssh "sudo") (not (kindIs "invalid" .ssh.sudo)) }}{{- $_ := set $s "sudo" .ssh.sudo -}}{{- end -}}
{{- $t := dict "name" .name "description" (.description | default "") "humans" (list $.Values.human.id) "ssh" $s -}}
{{- if .clients }}{{- $_ := set $t "clients" .clients -}}{{- end -}}
{{- $targets = append $targets $t -}}
{{- else -}}
{{- $k := dict -}}
{{- if .inCluster -}}{{- $_ := set $k "in_cluster" true -}}
{{- else -}}
{{- $_ := set $k "server" (required (printf "targets[%s].server is required" .name) .server) -}}
{{- $_ := set $k "ca_file" (printf "/etc/nyyrikki/targets/%s/ca.crt" .name) -}}
{{- $_ := set $k "token_file" (printf "/etc/nyyrikki/targets/%s/token" .name) -}}
{{- end -}}
{{- $t := dict "name" .name "description" (.description | default "") "humans" (list $.Values.human.id) "kubernetes" $k -}}
{{- if .clients }}{{- $_ := set $t "clients" .clients -}}{{- end -}}
{{- $targets = append $targets $t -}}
{{- end -}}
{{- end -}}
{{- $cfg := dict
  "server" (dict
    "canonical_url" (required "canonicalURL is required" .Values.canonicalURL)
    "listen" ":8443" "health_listen" ":8081"
    "tls_cert_file" "/etc/nyyrikki/tls/tls.crt" "tls_key_file" "/etc/nyyrikki/tls/tls.key"
    "state_dir" "/var/lib/nyyrikki" "runtime_dir" "/run/nyyrikki")
  "auth" (dict
    "issuer" (required "auth.issuer is required" .Values.auth.issuer)
    "cli_client_id" .Values.auth.cliClientID "scope" .Values.auth.scope
    "introspection_client_id" (.Values.auth.introspectionClientID | default (printf "%s/mcp" (trimSuffix "/" .Values.canonicalURL)))
    "introspection_secret_file" "/etc/nyyrikki/keycloak/client-secret")
  "approval" (dict "timeout" .Values.approval.timeout)
  "run" (dict "default_timeout" .Values.run.defaultTimeout "max_timeout" .Values.run.maxTimeout
    "max_interactive" .Values.run.maxInteractive "max_output" .Values.run.maxOutput)
  "humans" (list (dict
    "id" .Values.human.id
    "subject" (required "human.subject is required" .Values.human.subject)
    "kubernetes" (dict "user" (required "human.kubernetes.user is required" .Values.human.kubernetes.user) "groups" .Values.human.kubernetes.groups)
    "telegram_user_id" (required "human.telegramUserID is required" .Values.human.telegramUserID | int64)))
  "targets" $targets
  "groups" (.Values.groups | default list)
  "telegram" (dict "bot_token_file" "/etc/nyyrikki/telegram/bot-token" "api_url" .Values.telegram.apiURL)
-}}
{{- if eq (include "nyyrikki.hasSSH" .) "true" -}}
{{- if not .Values.ssh.userCAPublicKeys }}{{ fail "ssh.userCAPublicKeys is required with an SSH target" }}{{ end -}}
{{- if not .Values.ssh.sourceAddresses }}{{ fail "ssh.sourceAddresses is required with an SSH target" }}{{ end -}}
{{- $_ := set $cfg "ssh" (dict
  "user_ca_key_file" "/etc/nyyrikki/ssh/user-ca"
  "user_ca_public_keys" .Values.ssh.userCAPublicKeys
  "source_addresses" .Values.ssh.sourceAddresses
  "connect_timeout" .Values.ssh.connectTimeout
  "host_cas" (.Values.ssh.hostCAs | default list)
  "revoked_host_keys" (.Values.ssh.revokedHostKeys | default list)
  "defaults" (dict "sudo" (dig "defaults" "sudo" false .Values.ssh))) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nyyrikki.name" . }}
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ toYaml $cfg | indent 4 }}
