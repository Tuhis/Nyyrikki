{{- /*
The SSH CA Secret's install hook (docs/08 D16, OD9): a Job that creates
secrets.sshCA.name with fresh user-ca and host-ca keys through the API.
The Secret is not part of the release (M7), so Helm never replaces or
deletes it; an existing one is left alone, unread. The hook's grant is
`create` on Secrets in the namespace, which can't be limited to one name,
and lives only while the hook runs: its ServiceAccount, Role and
RoleBinding are deleted after the hook, whether it succeeds or fails.
*/ -}}
{{- if eq (include "nyyrikki.generateCA" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ssh-ca-init
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-ssh-ca-init
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  # Create only: no get, so the hook can't read an existing Secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-ssh-ca-init
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-ssh-ca-init
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-ssh-ca-init
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ssh-ca-init
  labels: {{- include "nyyrikki.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Not hook-failed: a failed Job's log stays for the administrator.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nyyrikki-ssh-ca
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-ssh-ca-init
      automountServiceAccountToken: true
      enableServiceLinks: false
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "nyyrikki.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ssh-ca
          image: {{ include "nyyrikki.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Prints only the public keys' fingerprints (docs/08 D16).
          args: ["ssh-ca", "init", "--create", "--name", {{ required "secrets.sshCA.name is required" .Values.secrets.sshCA.name | quote }}, "--release", {{ .Release.Name | quote }}]
          securityContext: {{- include "nyyrikki.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
