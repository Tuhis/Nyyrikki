name: E2E

# docs/01 §5.6: the end-to-end suite runs on merge to main and nightly.
# kind + Keycloak 26.8 + the image and chart from this commit (test/e2e).
on:
  push:
    branches: [main]
  # And on changes to the suite itself, so a fix to it is proven here
  # before it merges.
  pull_request:
    paths:
      - "test/e2e/**"
      # The stack setup it shares with the quickstart (docs/09 D6).
      - "test/stack/**"
      - "dev/quickstart/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.31.0
  HELM_VERSION: v3.19.0

jobs:
  e2e:
    # As ci.yml's RUNNER POOL, with RUNNER_LABEL_DISK: kind needs dind on a
    # real filesystem, so the e2e has a pool of its own.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.RUNNER_LABEL_DISK || 'ubuntu-latest' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@$KIND_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The quickstart shares the e2e's stack (test/stack) and is built
      # only with its own tag: this keeps it compiling.
      - name: Quickstart builds
        run: go vet -tags quickstart ./dev/quickstart/ ./test/stack/
      - name: End-to-end test
        env:
          # The test bind-mounts its temp files (Keycloak's certificate, the
          # fake Bot API's binary and key pair) into containers. On a
          # self-hosted runner dockerd is a sidecar that sees only the work
          # volume, so they go there.
          TMPDIR: ${{ runner.temp }}
        run: go test -tags e2e -count=1 -timeout 50m -v ./test/e2e/
