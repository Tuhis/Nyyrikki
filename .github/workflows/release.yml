name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # docs/06 D6: the image, the CLI and the chart carry one version.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload release assets
      packages: write   # push to ghcr.io
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # The image first: if it fails, nothing that points at it is
      # published.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          tags: ghcr.io/tuhis/nyyrikki:${{ needs.release-please.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: CLI binaries, chart and checksums
        env:
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Fail closed: never publish a reference without a digest.
          [[ $DIGEST == sha256:* ]] || { echo "no image digest: '$DIGEST'"; exit 1; }
          mkdir dist
          for os in linux darwin; do for arch in amd64 arm64; do
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/nyyrikki-$os-$arch" ./cmd/nyyrikki
          done; done
          helm package deploy/chart/nyyrikki --version "$VERSION" --app-version "$VERSION" -d dist
          # Also as an OCI chart, for GitOps installs by version (docs/06 D6).
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/nyyrikki-$VERSION.tgz" oci://ghcr.io/tuhis/charts
          # The image digest, so the chart's image.digest can be pinned
          # (docs/06 D6). Line 1: the full reference; line 2: the value for
          # image.digest.
          printf 'ghcr.io/tuhis/nyyrikki:%s@%s\n%s\n' "$VERSION" "$DIGEST" "$DIGEST" > dist/IMAGE
          (cd dist && sha256sum * > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
          # Idempotent on re-run: replace any earlier Image line.
          body=$(gh release view "$TAG" --json body --jq .body)
          printf '%s\n' "$body" | grep -v '^Image: ' > notes.md || true
          printf '\nImage: `ghcr.io/tuhis/nyyrikki:%s@%s` (set `image.digest` to `%s`)\n' "$VERSION" "$DIGEST" "$DIGEST" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
