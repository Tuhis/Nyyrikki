name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# RUNNER POOL: as ci.yml's (docs/01 D18). Only pushes to main run this, so
# no fork guard is needed.
jobs:
  release-please:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # docs/06 D6: the image, the CLI and the chart carry one version.
  # docs/09 D4: each is signed key-less with cosign and the signature is
  # verified here, against this workflow's identity, before anything that
  # points at it is published.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write   # upload release assets
      packages: write   # push to ghcr.io, with the signatures
      id-token: write   # the OIDC token for cosign's key-less signing only
    defaults:
      run:
        shell: bash     # -eo pipefail, not the default's -e alone
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
      # Who may have signed (docs/09 D4): this workflow on main, as the
      # GitHub OIDC issuer vouches. A literal, the same string users verify
      # against in docs/setup/install.md, so a fork or a rename fails here.
      SIGNER: https://github.com/Tuhis/Nyyrikki/.github/workflows/release.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # The installer checks the bootstrap cosign against digests in the
      # action itself, then the requested version's key-less signature.
      # Bumped by hand, like BuildKit below.
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.4
      # The CLI's licence notices (docs/09 D3, §5.3), before the image is
      # pushed: a failure here (the module proxy, an empty set) stops the
      # release before anything is published. The same go-licenses as the
      # image's build stage; CI runs the same script.
      - name: CLI licence notices
        run: |
          GO_LICENSES_VERSION=$(sed -n 's/^ARG GO_LICENSES_VERSION=//p' Dockerfile)
          [[ $GO_LICENSES_VERSION == v* ]] || { echo "no GO_LICENSES_VERSION in Dockerfile"; exit 1; }
          go install "github.com/google/go-licenses/v2@$GO_LICENSES_VERSION"
          mkdir dist
          PATH="$(go env GOPATH)/bin:$PATH" scripts/cli-licenses.sh dist/nyyrikki-licenses.tar.gz
      # The image first: if it fails, nothing that points at it is
      # published.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit builds and pushes the image, so it is pinned by digest
          # like the Dockerfile's base images: the default is a tag, pulled
          # through the self-hosted runners' registry cache (docs/01 D18).
          # Bumped by hand: no updater reads this line, so check BuildKit's
          # releases for security fixes when touching this workflow.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          tags: ghcr.io/tuhis/nyyrikki:${{ needs.release-please.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # BuildKit's SBOM and SLSA provenance, one attestation manifest
          # per platform inside the index, so the index's signature covers
          # them (docs/09 D4). Max provenance records the build args, of
          # which there is only VERSION.
          sbom: true
          provenance: mode=max
      - name: Sign and verify the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Fail closed: never sign or publish a reference without a digest.
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest: '$DIGEST'"; exit 1; }
          cosign sign --yes "ghcr.io/tuhis/nyyrikki@$DIGEST"
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            "ghcr.io/tuhis/nyyrikki@$DIGEST" > /dev/null
      - id: chart
        name: CLI binaries and chart, the OCI chart signed and verified
        env:
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/nyyrikki-$os-$arch" ./cmd/nyyrikki
          done; done
          helm package deploy/chart/nyyrikki --version "$VERSION" --app-version "$VERSION" -d dist
          # Also as an OCI chart, for GitOps installs by version (docs/06 D6).
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Helm 3 prints "Digest: sha256:..." on stderr, Helm 4 on stdout.
          out=$(helm push "dist/nyyrikki-$VERSION.tgz" oci://ghcr.io/tuhis/charts 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # Exactly one well-formed digest, or stop (fail closed).
          CHART_DIGEST=$(printf '%s\n' "$out" | sed -n 's/^Digest: //p')
          [[ $CHART_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no chart digest: '$CHART_DIGEST'"; exit 1; }
          cosign sign --yes "ghcr.io/tuhis/charts/nyyrikki@$CHART_DIGEST"
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            "ghcr.io/tuhis/charts/nyyrikki@$CHART_DIGEST" > /dev/null
          echo "digest=$CHART_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Checksums, signed and verified, then the release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest: '$DIGEST'"; exit 1; }
          [[ $CHART_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no chart digest: '$CHART_DIGEST'"; exit 1; }
          # The image digest, so the chart's image.digest can be pinned
          # (docs/06 D6). Line 1: the full reference; line 2: the value for
          # image.digest.
          printf 'ghcr.io/tuhis/nyyrikki:%s@%s\n%s\n' "$VERSION" "$DIGEST" "$DIGEST" > dist/IMAGE
          # The checksum of the SSH host setup script's body, byte for byte
          # what nyyrikkid serves before the data lines, for an administrator
          # to compare with (docs/07 D16, §5.7). Only the checksum: the
          # script is served by Nyyrikki, never handed out on its own (OD3).
          SETUP_SHA=$(sha256sum deploy/ssh-host/nyyrikki-host-setup.sh | cut -d' ' -f1)
          (cd dist && sha256sum * > SHA256SUMS)
          # SHA256SUMS covers every other asset, so its signature covers
          # them too (docs/09 D4). The bundle holds the signature, the
          # certificate and the transparency log entry.
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          # Only now, with every signature verified, is anything published
          # that points at the image.
          gh release upload "$TAG" dist/* --clobber
          # Idempotent on re-run: replace any earlier lines of ours.
          body=$(gh release view "$TAG" --json body --jq .body)
          printf '%s\n' "$body" | grep -v -e '^Image: ' -e '^Chart: ' -e '^SSH host setup script: ' -e '^Signed key-less ' > notes.md || true
          {
            printf '\nImage: `ghcr.io/tuhis/nyyrikki:%s@%s` (set `image.digest` to `%s`)\n' "$VERSION" "$DIGEST" "$DIGEST"
            printf '\nChart: `oci://ghcr.io/tuhis/charts/nyyrikki` version `%s`, digest `%s`\n' "$VERSION" "$CHART_DIGEST"
            printf '\nSSH host setup script: body sha256 `%s` (docs/setup/ssh-hosts.md)\n' "$SETUP_SHA"
            printf '\nSigned key-less with cosign: the image, the chart and `SHA256SUMS` (`SHA256SUMS.sigstore.json`). To verify, see docs/setup/install.md, "Verifying a release".\n'
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
