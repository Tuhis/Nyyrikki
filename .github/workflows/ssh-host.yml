name: SSH host setup

# docs/07 G8, G9, G13 and docs/08 G4, G5, G13: the SSH host setup script,
# its trust pull and its enrollment, run in Debian, Ubuntu (24.04 and
# 22.04), Rocky and Alpine containers, session kill in Debian and Ubuntu
# systemd containers (test/ssh-host), on changes to them and nightly.
on:
  push:
    branches: [main]
    paths:
      - "deploy/ssh-host/**"
      - "test/ssh-host/**"
      - "internal/hostsetup/**"
      - "docs/setup/ssh-hosts.md"
      - ".github/workflows/ssh-host.yml"
  pull_request:
    paths:
      - "deploy/ssh-host/**"
      - "test/ssh-host/**"
      - "internal/hostsetup/**"
      - "docs/setup/ssh-hosts.md"
      - ".github/workflows/ssh-host.yml"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssh-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssh-host:
    # As ci.yml's RUNNER POOL, on e2e.yml's RUNNER_LABEL_DISK pool: the
    # harness runs privileged systemd containers, which need dind.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.RUNNER_LABEL_DISK || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-go: it took ~2 of the job's minutes downloading Go into a
      # tool cache that dies with the ephemeral runner. The self-hosted
      # runner image has Go 1.26 on PATH, and ubuntu-latest has a Go whose
      # GOTOOLCHAIN=auto fetches the go.mod version. The tests drive shell
      # in containers, so the Go patch release doesn't matter here (the
      # gates in ci.yml keep check-latest for govulncheck).
      - run: go version
      - name: Setup script in containers
        # The cases are containers, mostly waiting: run more at once than
        # the runner has CPUs (SE6 added Alpine and the pull's cases). Every
        # top-level test is parallel too, so -parallel caps the containers
        # running at once across the whole suite. Locally (8 CPUs) the suite
        # took 967 s in sequence at -parallel 8, 714 s with every test
        # parallel, and 497 s at -parallel 16 with TestBadValuesRefused
        # sharded, using ~1.8 cores on average (2026-11-01).
        run: go test -tags sshhost -count=1 -timeout 60m -parallel 16 -v ./test/ssh-host/
