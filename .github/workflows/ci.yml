name: CI

on:
  push:
    branches: [main]
  pull_request:

# docs/01 D18: the default token can only read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0
  GO_LICENSES_VERSION: v2.0.1
  GITLEAKS_VERSION: v8.30.1
  KUBECONFORM_VERSION: v0.8.0
  HELM_VERSION: v3.19.0

# RUNNER POOL (docs/01 D18). `runs-on` reads the repository variable
# RUNNER_LABEL: the owner's self-hosted pool (ioio-k8s-nyyrikki). A pull
# request whose head isn't this repository runs on GitHub-hosted runners,
# so nobody outside the repository runs code on the owner's cluster. The
# check is positive: a head repository that is missing or unknown counts
# as outside. Unset, or in a fork's own runs (which inherit no variables),
# it falls back to ubuntu-latest.
jobs:
  build:
    # docs/01 G3: static binaries on both supported Go majors.
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # The latest patch, not a cached one: govulncheck flags fixed
          # standard-library vulnerabilities in older patches (docs/01 D1).
          check-latest: true
      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          go build -trimpath -o bin/ ./cmd/nyyrikkid ./cmd/nyyrikki
          for b in bin/*; do
            file "$b" | grep -q "statically linked" || { echo "$b is not static"; exit 1; }
          done
      # -p 2: at most two packages are built and linked at a time. The
      # race test binaries are 100 to 230 MB each since the SOPS library
      # (docs/10), and one link per CPU ran the runners out of disk (#75).
      - name: Test
        run: go test -race -count=1 -p 2 ./...

  gates:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install gate tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION
          go install golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION
          go install github.com/google/go-licenses/v2@$GO_LICENSES_VERSION
          go install github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION
          go install github.com/yannh/kubeconform/cmd/kubeconform@$KUBECONFORM_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Gates
        run: scripts/gates.sh
      - name: CLI licence notices, as the release packs them
        # docs/09 D3: the release's merge as this non-root user, so a
        # merge that only works as root fails here, not in a release
        # (review of #52).
        run: scripts/cli-licenses.sh "$RUNNER_TEMP/nyyrikki-licenses.tar.gz"
      - name: gates-selftest
        # Every gate must fail on its canary (docs/01 §5.6, G4).
        run: scripts/gates-selftest.sh

  image:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: go-licenses version matches the Dockerfile's
        run: |
          grep -qx "ARG GO_LICENSES_VERSION=$GO_LICENSES_VERSION" Dockerfile \
            || { echo "Dockerfile's GO_LICENSES_VERSION differs from ci.yml's ($GO_LICENSES_VERSION)"; exit 1; }
      - name: Build the image
        run: docker build -t nyyrikki:ci .
      - name: Runs as non-root and starts
        run: |
          test "$(docker inspect -f '{{.Config.User}}' nyyrikki:ci)" = "65532:65532"
          docker run --rm nyyrikki:ci --version
      - name: Holds the licence notices
        # docs/09 D3, §5.3. The image has no shell, so the directory is
        # copied out of a created (never started) container.
        run: |
          id=$(docker create nyyrikki:ci)
          trap 'docker rm "$id" >/dev/null' EXIT
          docker cp "$id:/usr/share/doc/nyyrikki/licenses" licenses
          for f in github.com/Tuhis/Nyyrikki/LICENSE github.com/modelcontextprotocol/go-sdk/LICENSE go/LICENSE; do
            test -s "licenses/$f" || { echo "missing $f"; exit 1; }
          done
          n=$(find licenses -type f | wc -l)
          [ "$n" -gt 3 ] || { echo "only $n licence files"; exit 1; }
          echo "$n licence files"
